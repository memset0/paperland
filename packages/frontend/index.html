<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: installable as a standalone app (Settings → Install app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0069A8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperland</title>
    <!-- Apply the persisted theme before first paint so a dark-mode reload never flashes light.
         Mirrors the key/logic in src/stores/theme.ts (which is authoritative once mounted). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('paperland_theme')
          var dark =
            m === 'dark' ||
            ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage / matchMedia unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
