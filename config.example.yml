database:
  type: sqlite
  path: ./data/paperland.db
  backup:
    enabled: true
    dir: ./data/backups
    retention_days: 30

# Optional: restrict allowed hosts (for CORS)
# allowed_hosts:
#   - localhost

auth:
  # true  = 会话登录 + 三级访问分层（公开只读 / 登录 / 仅管理员）
  # false = 开发期免登录（所有 /api 以 admin 身份访问）
  enabled: true
  # 'users' 已弃用：用户改存数据库。首次以 enabled:true 启动后端会自动创建 admin，
  # 并把随机初始密码打印到服务器日志（仅一次）；登录后到「账户菜单」改密码。
  # 新用户由管理员在「设置 → 用户管理」页面添加。

services:
  arxiv_metadata_service:
    max_concurrency: 3
    rate_limit_interval: 5
  arxiv_pdf_service:
    max_concurrency: 2
    rate_limit_interval: 3
  # Service name MUST match the code's registered name (semantic_scholar_service),
  # otherwise the configured concurrency/rate-limit is never bound to the service.
  semantic_scholar_service:
    max_concurrency: 1          # S2 default API key = 1 RPS across all endpoints
    rate_limit_interval: 1      # seconds between requests; without a key, use 3
    # Optional Semantic Scholar API key for higher rate limits, sent as the
    # `x-api-key` header. Prefer api_key_env to avoid committing secrets; or set
    # api_key directly since config.yml is gitignored.
    # api_key_env: SEMANTIC_SCHOLAR_API_KEY
    # api_key: s2k-xxxxxxxxxxxxxxxx
  pdf_parse:
    max_concurrency: 2
    method: nodejs
  papers_cool:
    max_concurrency: 1
    rate_limit_interval: 5
  qa:
    max_concurrency: 2
  # Translation service (English→Chinese). Concurrency + rate limit for its AI calls.
  translation_service:
    max_concurrency: 2
    rate_limit_interval: 1

models:
  default: gpt-4o
  available:
    - name: gpt-4o
      type: openai_api
      endpoint: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    # - name: codex-gpt-5.4
    #   type: codex
    #   shell: 'codex exec --skip-git-repo-check --model "gpt-5.4"'
    #   timeout: 600

content_priority:
  - user_input
  - pdf_parsed

system_prompt: |
  Answer the following question based on the paper content: {PROMPT}

  ---

  {PAPER}

qa:
  - name: research-question
    prompt: "What problem does this paper try to solve?"
  - name: related-works
    prompt: "What are the related works and prerequisite knowledge?"
  - name: method
    prompt: "How does the paper solve the proposed research problem?"
  - name: experiments
    prompt: "What experiments does the paper conduct? How do they validate the claims?"
  - name: conclusion
    prompt: "What are the main conclusions?"
  - name: summary
    prompt: "Summarize the main content of this paper and give a one-sentence takeaway."

# Translation (English→Chinese). `{TEXT}` is replaced with the source text. `model` is optional
# and falls back to models.default. Edit `prompt` to tune wording without touching code.
translation:
  # model: gpt-4o
  prompt: |
    You are a professional translator. Translate the following English text into Simplified Chinese.
    Strictly preserve the original formatting: keep all Markdown syntax, code blocks, inline code, LaTeX
    math, lists, tables, and line breaks exactly as in the source. Translate only the natural-language
    text; do NOT translate code, math, URLs, or identifiers. Output only the translation, with no extra
    explanation or wrapping.

    {TEXT}

# Embedded pdf.js viewer settings.
pdf_viewer:
  # DPI used when capturing a PDF region as a PNG screenshot (PdfViewer "框选截图" → 图床).
  # Higher = sharper but larger files. Render scale = screenshot_dpi / 72.
  screenshot_dpi: 300
